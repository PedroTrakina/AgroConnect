<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroConnect - Preços Médios</title>

<style>

:root{
--primary:#2e7d32;
--bg:#f4f6f4;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:var(--bg);
}

header{
background:var(--primary);
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:1000px;
margin:30px auto;
padding:20px;
}

.card{
background:white;
padding:20px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:15px;
border:1px solid #ddd;
}

th{
background:#f1f1f1;
}

footer{
margin-top:40px;
background:#333;
color:white;
padding:15px;
text-align:center;
}

</style>
</head>
<body>

<header>
<h1>💰 Preços Médios do Mercado</h1>
</header>

<div class="container">

<table>

<th>Preço Médio</th>

<tr>
<td>🌱 Soja (60kg)</td>

</tr>

<tr>
<td>🫘 Feijão (60kg)</td>

</tr>

<tr>

</tr>

</div>

<footer>

</html>
